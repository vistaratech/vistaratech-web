<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fav-cyan" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>
    <linearGradient id="fav-purple" x1="52" y1="12" x2="12" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00F0FF" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#07090E" />
  <rect width="64" height="64" rx="14" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1" />
  
  <!-- Outer Hexagonal Cyber Ring -->
  <polygon points="32,8 52,19 52,45 32,56 12,45 12,19" stroke="url(#fav-cyan)" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="3 2" />

  <!-- Interlocking Hexagonal Vortex Ribbon 1 -->
  <path d="M 32 14 L 46 22 L 46 36 L 40 33 L 40 25 L 32 20 Z" fill="url(#fav-cyan)" filter="url(#fav-glow)" />
  <!-- Interlocking Hexagonal Vortex Ribbon 2 -->
  <path d="M 48 30 L 48 46 L 34 54 L 34 47 L 42 42 L 42 33 Z" fill="url(#fav-purple)" />
  <!-- Interlocking Hexagonal Vortex Ribbon 3 -->
  <path d="M 32 50 L 18 42 L 18 28 L 24 31 L 24 39 L 32 44 Z" fill="url(#fav-cyan)" />
  <!-- Interlocking Hexagonal Vortex Ribbon 4 -->
  <path d="M 16 34 L 16 18 L 30 10 L 30 17 L 22 22 L 22 31 Z" fill="url(#fav-purple)" />

  <!-- Center Core Pulsing Node -->
  <circle cx="32" cy="32" r="3" fill="#FFFFFF" filter="url(#fav-glow)" />
  <circle cx="32" cy="32" r="6" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.8" />
